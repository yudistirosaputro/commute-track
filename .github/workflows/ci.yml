name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # JOB 1: QUALITY CHECKS (Lint & Unit Tests)
  # Runs on every Push and PR to ensure code quality.
  # -----------------------------------------------------------------
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 # FIXES THE GRADLE 9 CRASH

      - name: Run Lint
        run: ./gradlew :app:lintDebug

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 5

  # -----------------------------------------------------------------
  # JOB 2: DEBUG BUILD
  # Ensures the app compiles correctly.
  # -----------------------------------------------------------------
  build-debug:
    name: Build Debug APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # -----------------------------------------------------------------
  # JOB 3: RELEASE BUILD (CD)
  # Only runs on pushes to 'main'. Builds signed APK/Bundle.
  # -----------------------------------------------------------------
  build-release:
    name: Build Release
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1. Decode Keystore from Secrets
      - name: Decode Keystore
        env:
          ENCODED_STRING: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
        run: |
          echo $ENCODED_STRING | base64 -d > $KEYSTORE_PATH

      # 2. Build Signed Release (Injecting Secrets)
      - name: Build Release APK & Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      # 3. Upload Signed Artifacts
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30